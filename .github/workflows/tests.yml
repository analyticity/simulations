name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project -o requirements.lock
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Run unit tests
        run: pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libspatialindex-dev

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --extra geo --no-emit-project -o requirements.lock
          uv pip install --system -r requirements.lock
          uv pip install --system --no-deps -e .

      - name: Run integration tests
        env:
          RUN_BUILD_NETWORK_E2E: "1"
        run: pytest tests/integration -v -m integration --timeout=300
